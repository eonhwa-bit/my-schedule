<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>이번 주 방송 · 시집 진행률</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #EDEAE2;
    --paper-deep: #E1DDD0;
    --ink: #262A31;
    --ink-soft: #6C727C;
    --vermillion: #A9863E;
    --line: rgba(38,42,49,0.14);

    --c-siwriting: #A9863E;
    --c-program: #465268;
    --c-adsp: #3F5A5C;
    --c-lecture: #5C4B5E;
    --c-free: #5C6B4E;
    --c-game: #33404F;
    --c-prep: #8C7B65;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{
    max-width:640px;
    margin:0 auto;
    padding:36px 20px 64px;
  }

  /* header */
  header{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:16px;
    margin-bottom:26px;
  }
  .title-row{ display:flex; align-items:center; gap:10px; margin-bottom:6px; }
  .glasses-mark{ flex:0 0 auto; opacity:0.85; }
  h1{
    font-family:'Noto Serif KR', serif;
    font-weight:700;
    font-size:28px;
    margin:0;
    letter-spacing:-0.01em;
  }
  .sub{ color:var(--ink-soft); font-size:14px; margin:0; }

  .pinstripe-soft{
    background-image: repeating-linear-gradient(115deg, rgba(38,42,49,0.05) 0px, rgba(38,42,49,0.05) 1px, transparent 1px, transparent 7px);
  }
  .pinstripe{
    background-image: repeating-linear-gradient(115deg, rgba(255,255,255,0.10) 0px, rgba(255,255,255,0.10) 1px, transparent 1px, transparent 7px);
  }

  .mode-btn{
    flex:0 0 auto;
    background:transparent;
    border:1px solid var(--ink);
    color:var(--ink);
    font-family:inherit;
    font-size:12.5px;
    padding:8px 14px;
    border-radius:3px;
    cursor:pointer;
    white-space:nowrap;
    transition:background .15s, color .15s;
  }
  .mode-btn:hover{ background:var(--ink); color:var(--paper); }
  .mode-btn.on{ background:var(--vermillion); border-color:var(--vermillion); color:#fff; }
  .mode-btn.on:hover{ opacity:.9; background:var(--vermillion); color:#fff; }

  .admin-banner{
    display:none;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    background:var(--vermillion);
    color:#fff;
    font-size:13px;
    padding:10px 14px;
    border-radius:4px;
    margin-bottom:18px;
    flex-wrap:wrap;
  }
  .admin-banner button{
    background:rgba(255,255,255,0.18);
    border:1px solid rgba(255,255,255,0.5);
    color:#fff;
    font-family:inherit;
    font-size:12px;
    padding:6px 11px;
    border-radius:3px;
    cursor:pointer;
  }
  .admin-banner button:hover{ background:rgba(255,255,255,0.3); }

  /* announcement */
  .announce{
    display:none;
    align-items:center;
    gap:10px;
    background:var(--vermillion);
    padding:12px 16px;
    border-radius:4px;
    font-size:13.5px;
    margin-bottom:22px;
  }
  .announce .icon{ flex:0 0 auto; width:18px; height:18px; }
  .announce b{ color:#fff; font-weight:700; margin-right:6px; }
  .announce span:not(.icon){ color:#fff; }
  .announce-edit{ margin-bottom:22px; }
  .announce-edit label{ font-size:11.5px; color:var(--ink-soft); display:block; margin-bottom:4px; }
  .announce-edit textarea{
    width:100%; font-family:inherit; font-size:13px; padding:8px 10px;
    border:1px solid var(--line); border-radius:3px; background:#fff; color:var(--ink);
    min-height:44px; resize:vertical;
  }

  /* section title */
  .section-title{
    font-family:'Noto Serif KR', serif;
    font-size:16px;
    font-weight:500;
    margin:0 0 14px;
    color:var(--ink);
  }

  /* countdown */
  .countdown-card{
    display:none;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    background:var(--ink);
    color:var(--paper);
    padding:14px 18px;
    border-radius:6px;
    margin-bottom:26px;
    flex-wrap:wrap;
  }
  .countdown-card .cd-label{ font-size:12px; color:rgba(237,234,226,0.65); }
  .countdown-card .cd-main{ font-family:'Noto Serif KR', serif; font-size:16px; font-weight:500; }
  .countdown-card .cd-time{ font-size:20px; font-weight:700; color:var(--vermillion); }

  /* schedule list */
  .schedule{ list-style:none; margin:0 0 18px; padding:0; border-top:1px solid var(--line); }
  .day-row{ display:flex; gap:14px; padding:14px 2px; border-bottom:1px solid var(--line); position:relative; }
  .day-row.today{
    background-color:var(--paper-deep);
    background-image: repeating-linear-gradient(115deg, rgba(38,42,49,0.05) 0px, rgba(38,42,49,0.05) 1px, transparent 1px, transparent 7px);
    margin:0 -12px; padding-left:14px; padding-right:14px; border-radius:4px; border-bottom-color:transparent;
    border-left:2px solid var(--vermillion);
  }
  .day-row.today + .day-row{ border-top:none; }
  .day-label{ flex:0 0 46px; font-family:'Noto Serif KR', serif; font-weight:700; font-size:15px; padding-top:2px; }
  .day-label .dot{ display:block; font-size:9px; color:var(--vermillion); font-family:'Noto Sans KR',sans-serif; font-weight:700; margin-top:2px; }
  .day-body{ flex:1; min-width:0; }
  .day-title{ font-size:15.5px; font-weight:500; margin:0 0 4px; }
  .day-title.placeholder{ color:var(--ink-soft); font-style:normal; }
  .day-time{ font-size:12.5px; color:var(--ink-soft); margin:0 0 6px; }
  .chips{ display:flex; flex-wrap:wrap; gap:6px; }
  .chip{ font-size:11px; padding:2px 9px; border-radius:999px; color:#fff; line-height:1.7; }

  .ics-btn-wrap{ text-align:center; margin:0 0 40px; }
  .ics-btn{
    background:transparent; border:1px solid var(--ink); color:var(--ink);
    font-family:inherit; font-size:12.5px; padding:9px 18px; border-radius:99px; cursor:pointer;
  }
  .ics-btn:hover{ background:var(--ink); color:var(--paper); }

  /* admin edit fields */
  .edit-fields{ display:flex; flex-direction:column; gap:6px; margin-top:6px; }
  .edit-fields input[type=text], .edit-fields input[type=time], .edit-fields select, .edit-fields textarea{
    font-family:inherit; font-size:13px; padding:6px 8px; border:1px solid var(--line);
    border-radius:3px; background:#fff; color:var(--ink); width:100%;
  }
  .edit-row{ display:flex; gap:6px; }
  .edit-row > *{ flex:1; }
  .edit-row label.mini{ font-size:10.5px; color:var(--ink-soft); display:flex; flex-direction:column; gap:2px; }
  .memo-box textarea{ min-height:44px; resize:vertical; }
  .field-label{ font-size:10.5px; color:var(--ink-soft); margin:2px 0 -2px; }
  .publish-toggle{ display:flex; align-items:center; gap:6px; font-size:12px; color:var(--ink-soft); margin-top:4px; cursor:pointer; user-select:none; }

  /* poll */
  .poll-card{
    background:var(--paper-deep);
    border-radius:6px;
    padding:20px 20px 18px;
    margin-bottom:40px;
  }
  .poll-question{ font-family:'Noto Serif KR', serif; font-size:16px; font-weight:500; margin:0 0 14px; }
  .poll-empty{ font-size:13px; color:var(--ink-soft); }
  .poll-options{ display:flex; flex-direction:column; gap:8px; }
  .poll-opt{
    position:relative;
    border:1px solid var(--line);
    border-radius:4px;
    background:#fff;
    padding:10px 12px;
    cursor:pointer;
    overflow:hidden;
    text-align:left;
    font-family:inherit;
  }
  .poll-opt .fill{
    position:absolute; left:0; top:0; bottom:0;
    background:rgba(169,134,62,0.18);
    z-index:0;
    transition:width .3s ease;
  }
  .poll-opt.voted{ border-color:var(--vermillion); }
  .poll-opt .row{ position:relative; z-index:1; display:flex; justify-content:space-between; font-size:13.5px; }
  .poll-opt .pct{ color:var(--ink-soft); font-size:12px; }
  .poll-opt:disabled{ cursor:default; }
  .poll-note{ font-size:11.5px; color:var(--ink-soft); margin-top:10px; }
  .poll-edit{ margin-top:16px; padding-top:16px; border-top:1px dashed var(--line); display:flex; flex-direction:column; gap:8px; }
  .poll-edit input[type=text]{
    font-family:inherit; font-size:13px; padding:7px 9px; border:1px solid var(--line);
    border-radius:3px; background:#fff; color:var(--ink); width:100%;
  }
  .poll-edit .opt-row{ display:flex; gap:6px; align-items:center; }
  .poll-edit label.chk{ display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--ink-soft); }
  .poll-edit-actions{ display:flex; gap:8px; margin-top:4px; }
  .poll-edit-actions button{
    font-family:inherit; font-size:12px; padding:7px 12px; border-radius:3px; cursor:pointer; border:1px solid var(--line); background:#fff;
  }
  .poll-edit-actions .reset{ color:var(--vermillion); border-color:var(--vermillion); }

  /* progress */
  .progress-card{ background:var(--paper-deep); border-radius:6px; padding:22px 20px; margin-bottom:40px; }
  .progress-head{ display:flex; justify-content:space-between; align-items:baseline; gap:10px; margin-bottom:14px; }
  .progress-title{ font-family:'Noto Serif KR', serif; font-size:17px; font-weight:500; margin:0; }
  .dday{ font-size:13px; font-weight:700; color:var(--vermillion); white-space:nowrap; }
  .bar-track{ background:rgba(43,41,38,0.1); height:9px; border-radius:99px; overflow:hidden; margin-bottom:8px; }
  .bar-fill{ height:100%; background:var(--vermillion); border-radius:99px; transition:width .3s ease; }
  .progress-nums{ display:flex; justify-content:space-between; font-size:12.5px; color:var(--ink-soft); }
  .progress-edit{ margin-top:14px; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .progress-edit label{ font-size:12px; color:var(--ink-soft); }
  .progress-edit input[type=number], .progress-edit input[type=date]{
    font-family:inherit; font-size:13px; padding:5px 7px; border:1px solid var(--line);
    border-radius:3px; width:90px; background:#fff;
  }

  /* suggestion box */
  .suggest-card{ margin-bottom:8px; }
  .suggest-form{ display:flex; flex-direction:column; gap:8px; margin-bottom:16px; }
  .suggest-form input[type=text]{
    font-family:inherit; font-size:13.5px; padding:9px 12px; border:1px solid var(--line);
    border-radius:4px; background:#fff; color:var(--ink);
  }
  .suggest-form textarea{
    font-family:inherit; font-size:13.5px; padding:10px 12px; border:1px solid var(--line);
    border-radius:4px; background:#fff; color:var(--ink); min-height:60px; resize:vertical;
  }
  .suggest-form button{
    align-self:flex-end;
    background:var(--ink); color:var(--paper); border:none; font-family:inherit;
    font-size:13px; padding:9px 18px; border-radius:4px; cursor:pointer;
  }
  .suggest-form button:hover{ opacity:.9; }
  .suggest-list{ display:flex; flex-direction:column; gap:8px; margin-top:10px; }
  .suggest-item{
    background:#fff; border:1px solid var(--line); border-radius:4px; padding:10px 12px;
    font-size:13px;
  }
  .suggest-item-head{ display:flex; justify-content:space-between; gap:10px; align-items:center; }
  .suggest-item .title-row{ display:flex; align-items:center; gap:6px; margin:0; }
  .suggest-item .title-row .th{ font-weight:500; }
  .suggest-item .tag{
    font-size:10.5px; padding:1px 7px; border-radius:999px; background:var(--paper-deep); color:var(--ink-soft);
  }
  .suggest-item .tag.mine{ background:var(--vermillion); color:#fff; }
  .suggest-item .txt{ white-space:pre-wrap; word-break:break-word; margin-top:6px; }
  .suggest-item .locked{ color:var(--ink-soft); font-style:italic; margin-top:6px; }
  .suggest-item .meta{ font-size:11px; color:var(--ink-soft); margin-top:4px; }
  .suggest-item button{
    flex:0 0 auto; background:transparent; border:1px solid var(--line); color:var(--ink-soft);
    font-family:inherit; font-size:11px; padding:4px 9px; border-radius:3px; cursor:pointer;
  }
  .suggest-item button:hover{ color:var(--vermillion); border-color:var(--vermillion); }
  .suggest-admin-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
  .suggest-admin-head button{
    background:transparent; border:1px solid var(--line); color:var(--ink-soft);
    font-family:inherit; font-size:11.5px; padding:5px 10px; border-radius:3px; cursor:pointer;
  }

  .save-bar{ display:none; position:sticky; bottom:14px; justify-content:center; margin-top:20px; }
  .save-bar button{
    background:var(--ink); color:var(--paper); border:none; font-family:inherit; font-size:13.5px;
    padding:11px 26px; border-radius:4px; cursor:pointer; box-shadow:0 4px 14px rgba(0,0,0,0.18);
  }
  .save-bar button:hover{ opacity:.9; }

  footer{ margin-top:32px; font-size:11.5px; color:var(--ink-soft); text-align:center; }

  /* modal */
  .modal-overlay{ display:none; position:fixed; inset:0; background:rgba(38,42,49,0.45); align-items:center; justify-content:center; padding:20px; z-index:50; }
  .modal{ background:var(--paper); border-radius:6px; padding:24px; max-width:340px; width:100%; }
  .modal h2{ font-family:'Noto Serif KR', serif; font-size:16px; margin:0 0 10px; }
  .modal p{ font-size:13px; color:var(--ink-soft); margin:0 0 14px; }
  .modal input[type=password]{
    width:100%; font-family:inherit; font-size:14px; padding:9px 10px; border:1px solid var(--line);
    border-radius:3px; background:#fff; color:var(--ink); margin-bottom:6px;
  }
  .modal .modal-error{ color:var(--vermillion); font-size:12px; margin:2px 0 12px; }
  .modal-actions{ display:flex; gap:8px; justify-content:flex-end; }
  .modal-actions button{ font-family:inherit; font-size:13px; padding:8px 14px; border-radius:3px; cursor:pointer; border:1px solid var(--line); }
  .modal-actions .confirm{ background:var(--vermillion); color:#fff; border-color:var(--vermillion); }
  .modal-actions .cancel{ background:transparent; color:var(--ink); }

  .toast{
    position:fixed; left:50%; bottom:24px; transform:translateX(-50%);
    background:var(--ink); color:var(--paper); font-size:13px; padding:10px 18px; border-radius:4px;
    opacity:0; pointer-events:none; transition:opacity .25s; z-index:60;
  }
  .toast.show{ opacity:1; }

  @media (max-width:420px){
    h1{ font-size:24px; }
    .day-row{ gap:10px; }
    .day-label{ flex-basis:38px; font-size:14px; }
    .countdown-card{ flex-direction:column; align-items:flex-start; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="title-row">
        <svg class="glasses-mark" width="34" height="16" viewBox="0 0 34 16" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <circle cx="8" cy="8" r="6.5" stroke="var(--ink)" stroke-width="1.4"/>
          <circle cx="26" cy="8" r="6.5" stroke="var(--ink)" stroke-width="1.4"/>
          <path d="M14.5 7C15.5 5.5 18.5 5.5 19.5 7" stroke="var(--ink)" stroke-width="1.4"/>
          <path d="M1.5 8H0" stroke="var(--ink)" stroke-width="1.4"/>
          <path d="M34 8H32.5" stroke="var(--ink)" stroke-width="1.4"/>
        </svg>
        <h1>이번 주 방송</h1>
      </div>
      <p class="sub">매일 밤, 코드와 문장 사이</p>
    </div>
    <button class="mode-btn" id="modeBtn">관리자 모드</button>
  </header>

  <div class="admin-banner pinstripe" id="adminBanner">
    <span>관리자 모드 · 이 화면의 수정 내용은 모든 방문자에게 공개됩니다</span>
    <span style="display:flex; gap:8px;">
      <button id="changePwBtn">비밀번호 변경</button>
      <button id="exitAdminBtn">공개 화면으로</button>
    </span>
  </div>

  <div class="announce" id="announceBanner">
    <svg class="icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M12 3C9.5 3 8 5 8 7.5V11L6 15h12l-2-4V7.5C16 5 14.5 3 12 3Z" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M10 17.5a2 2 0 0 0 4 0" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/>
    </svg>
    <span><b>공지</b><span id="announceText"></span></span>
  </div>
  <div class="announce-edit" id="announceEdit" style="display:none;">
    <label>공지 (비워두면 공개 화면에 표시되지 않아요)</label>
    <textarea id="announceInput" placeholder="예: 이번 주 목요일 방송은 11시로 미뤄져요"></textarea>
  </div>

  <div class="countdown-card" id="countdownCard">
    <div>
      <div class="cd-label">다음 방송</div>
      <div class="cd-main" id="cdMain"></div>
    </div>
    <div class="cd-time" id="cdTime"></div>
  </div>

  <h2 class="section-title">요일별 방송</h2>
  <ul class="schedule" id="scheduleList"></ul>

  <div class="ics-btn-wrap">
    <button class="ics-btn" id="icsBtn">캘린더에 이번 주 일정 추가 (.ics)</button>
  </div>

  <h2 class="section-title">다음 방송 주제 투표</h2>
  <div class="poll-card">
    <p class="poll-question" id="pollQuestion"></p>
    <div id="pollBody"></div>
    <div class="poll-edit" id="pollEdit" style="display:none;">
      <label class="field-label">투표 질문</label>
      <input type="text" id="pollQInput" placeholder="예: 이번 주 금요일 자유방송 뭐 할까요?">
      <div class="opt-row"><input type="text" id="pollOpt0" placeholder="선택지 1"></div>
      <div class="opt-row"><input type="text" id="pollOpt1" placeholder="선택지 2"></div>
      <div class="opt-row"><input type="text" id="pollOpt2" placeholder="선택지 3 (선택)"></div>
      <div class="opt-row"><input type="text" id="pollOpt3" placeholder="선택지 4 (선택)"></div>
      <label class="chk"><input type="checkbox" id="pollActive"> 투표 진행 중 (체크 해제 시 공개 화면에서 숨김)</label>
      <div class="poll-edit-actions">
        <button id="pollSaveBtn">투표 내용 저장</button>
        <button class="reset" id="pollResetBtn">투표 초기화</button>
      </div>
    </div>
  </div>

  <h2 class="section-title">브런치 시집 진행률</h2>
  <div class="progress-card">
    <div class="progress-head">
      <p class="progress-title" id="progressTitle"></p>
      <span class="dday" id="ddayLabel"></span>
    </div>
    <div class="bar-track"><div class="bar-fill" id="barFill"></div></div>
    <div class="progress-nums">
      <span id="progressNums"></span>
      <span id="progressPercent"></span>
    </div>
    <div class="progress-edit" id="progressEdit" style="display:none;">
      <label>제목 <input type="text" id="editTitle" style="width:170px;"></label>
      <label>완성 <input type="number" id="editCurrent" min="0"></label>
      <label>목표 <input type="number" id="editTarget" min="1"></label>
      <label>마감 <input type="date" id="editDeadline"></label>
    </div>
  </div>

  <h2 class="section-title">시청자 건의함</h2>
  <div class="suggest-card">
    <div class="suggest-form" id="suggestForm">
      <input type="text" id="suggestTitle" placeholder="제목 (예: 이 요일엔 이런 콘텐츠 어때요)" maxlength="60">
      <textarea id="suggestText" placeholder="내용을 자유롭게 남겨주세요 (제목만 목록에 공개되고, 내용은 관리자와 작성자 본인만 볼 수 있어요)"></textarea>
      <button id="suggestSendBtn">제안 보내기</button>
    </div>
    <div class="suggest-admin-head">
      <span class="field-label" id="suggestCount"></span>
      <button id="suggestClearBtn" style="display:none;">전체 삭제</button>
    </div>
    <div class="suggest-list" id="suggestList"></div>
  </div>

  <footer id="footerNote"></footer>

  <div class="save-bar" id="saveBar">
    <button id="saveBtn">변경사항 저장</button>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h2 id="modalTitle">관리자 로그인</h2>

<script>
const CATEGORIES = {

const DAY_NAMES = ["월","화","수","목","금","토","일"];

function defaultState(){

    days: [
      { title:"시 쓰기 + ADsP 공부", time:"22:00 - 23:00", startTime:"22:00", endTime:"23:00", cats:["시쓰기","ADsP공부"], memo:"", published:true },

      { title:"자유 방송",           time:"22:00 - 23:00", startTime:"22:00", endTime:"23:00", cats:["자유방송","없음"], memo:"", published:true },
      { title:"시 쓰기 + 종합게임",   time:"13:00 ~",       startTime:"13:00", endTime:"15:00", cats:["시쓰기","종합게임"], memo:"", published:true },

    ],

    poll: { question:"", options:["","","",""], active:false, version:1 },
    updatedAt: null,
    adminPasswordHash: null
  };
}

let state = null;
let isAdmin = false;
let modalMode = "login";
let countdownTimer = null;

async function hashText(text){
  const enc = new TextEncoder().encode(text);
  const buf = await crypto.subtle.digest("SHA-256", enc);
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,"0")).join("");
}

function getViewerId(){
  let id = localStorage.getItem("viewerId");
  if(!id){
    id = Math.random().toString(36).slice(2,10) + Date.now().toString(36);
    localStorage.setItem("viewerId", id);
  }
  return id;
}

async function loadData(){
  try{
    const docSnap = await db.collection("app").doc(STORAGE_KEY).get();
    state = docSnap.exists ? docSnap.data() : defaultState();
  }catch(e){
    console.error(e);
    state = defaultState();
    showToast("Firebase 연결에 실패했어요. 설정값을 확인해주세요");
  }
  if(!state.days || state.days.length !== 7){ state = defaultState(); }
  if(!state.poll) state.poll = { question:"", options:["","","",""], active:false, version:1 };
  if(typeof state.announcement !== "string") state.announcement = "";
  render();
  startCountdown();
  await renderPoll();
}

async function saveData(){
  state.updatedAt = new Date().toISOString();
  try{
    await db.collection("app").doc(STORAGE_KEY).set(state);
    showToast("저장했어요");
    render();
  }catch(e){
    console.error(e);
    showToast("저장에 실패했어요. 다시 시도해주세요");
  }
}

function showToast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"), 1800);
}

function todayIndex(){
  const d = new Date().getDay();
  return (d + 6) % 7;
}

function ddayText(deadline){
  const now = new Date();
  const target = new Date(deadline + "T23:59:59");
  const diffMs = target - new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const days = Math.ceil(diffMs / 86400000);
  if(days > 0) return "D-" + days;
  if(days === 0) return "D-DAY";
  return "마감";
}

function chipHtml(catKey){
  const c = CATEGORIES[catKey] || CATEGORIES["없음"];
  if(catKey === "없음") return "";
  return `<span class="chip" style="background:${c.color}">${c.label}</span>`;
}

function categoryOptions(selected){
  return Object.keys(CATEGORIES).map(k =>
    `<option value="${k}" ${k===selected?"selected":""}>${CATEGORIES[k].label}</option>`
  ).join("");
}

/* ---------- next occurrence / countdown ---------- */
function nextOccurrence(dayIdx, hhmm){
  if(!hhmm) return null;
  const [h,m] = hhmm.split(":").map(Number);
  const now = new Date();
  const tIdx = todayIndex();
  let delta = (dayIdx - tIdx + 7) % 7;
  let candidate = new Date(now.getFullYear(), now.getMonth(), now.getDate() + delta, h, m, 0, 0);
  if(candidate <= now){ candidate = new Date(candidate.getTime() + 7*86400000); }
  return candidate;
}

function findNextBroadcast(){
  let best = null;
  state.days.forEach((day,i)=>{
    if(!day.published || !day.startTime) return;
    const dt = nextOccurrence(i, day.startTime);
    if(dt && (!best || dt < best.dt)) best = { dt, day, i };
  });
  return best;
}

function renderCountdown(){
  const card = document.getElementById("countdownCard");
  const next = findNextBroadcast();
  if(!next){ card.style.display = "none"; return; }
  card.style.display = "flex";
  const now = new Date();
  const diff = next.dt - now;
  const totalMin = Math.max(0, Math.floor(diff/60000));
  const d = Math.floor(totalMin/1440);
  const h = Math.floor((totalMin%1440)/60);
  const m = totalMin%60;
  let timeText;
  if(d > 0) timeText = `${d}일 ${h}시간 후`;
  else if(h > 0) timeText = `${h}시간 ${m}분 후`;
  else timeText = `${m}분 후`;
  document.getElementById("cdMain").textContent = `${DAY_NAMES[next.i]}요일 · ${next.day.title}`;
  document.getElementById("cdTime").textContent = timeText;
}

function startCountdown(){
  renderCountdown();
  if(countdownTimer) clearInterval(countdownTimer);
  countdownTimer = setInterval(renderCountdown, 30000);
}

/* ---------- ICS ---------- */
function pad(n){ return String(n).padStart(2,"0"); }
function formatICSDate(dt){
  return `${dt.getFullYear()}${pad(dt.getMonth()+1)}${pad(dt.getDate())}T${pad(dt.getHours())}${pad(dt.getMinutes())}00`;
}
function escapeICS(str){ return String(str).replace(/[,;]/g,"\\$&").replace(/\n/g," "); }

function buildICS(){
  const lines = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//weekly-schedule//KR","CALSCALE:GREGORIAN"];
  state.days.forEach((day,i)=>{
    if(!day.published || !day.startTime) return;
    const start = nextOccurrence(i, day.startTime);
    let end;
    if(day.endTime){
      const [eh,em] = day.endTime.split(":").map(Number);
      end = new Date(start.getFullYear(), start.getMonth(), start.getDate(), eh, em, 0, 0);
      if(end <= start) end = new Date(end.getTime() + 86400000);
    } else {
      end = new Date(start.getTime() + 2*3600000);
    }
    lines.push("BEGIN:VEVENT");
    lines.push(`UID:day${i}-${STORAGE_KEY}@weekly-schedule`);
    lines.push(`DTSTAMP:${formatICSDate(new Date())}`);
    lines.push(`DTSTART:${formatICSDate(start)}`);
    lines.push(`DTEND:${formatICSDate(end)}`);
    lines.push(`RRULE:FREQ=WEEKLY;BYDAY=${BYDAY[i]}`);
    lines.push(`SUMMARY:${escapeICS(day.title)}`);
    lines.push("END:VEVENT");
  });
  lines.push("END:VCALENDAR");
  return lines.join("\r\n");
}

function downloadICS(){
  const hasAny = state.days.some(d => d.published && d.startTime);
  if(!hasAny){ showToast("등록할 공개 일정이 없어요"); return; }
  const ics = buildICS();
  const blob = new Blob([ics], { type:"text/calendar;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "weekly-broadcast.ics";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast("캘린더 파일을 내려받았어요");
}

/* ---------- poll ---------- */
function pollOptionIds(){
  return state.poll.options.map((label,idx)=>({ idx, label })).filter(o => o.label && o.label.trim());
}

async function renderPoll(){
  const p = state.poll;
  document.getElementById("pollQuestion").textContent = p.question || "아직 등록된 투표가 없어요";
  const body = document.getElementById("pollBody");
  const opts = pollOptionIds();

  if(isAdmin){
    document.getElementById("pollEdit").style.display = "flex";
    document.getElementById("pollQInput").value = p.question;
    document.getElementById("pollOpt0").value = p.options[0] || "";
    document.getElementById("pollOpt1").value = p.options[1] || "";
    document.getElementById("pollOpt2").value = p.options[2] || "";
    document.getElementById("pollOpt3").value = p.options[3] || "";
    document.getElementById("pollActive").checked = !!p.active;
  } else {
    document.getElementById("pollEdit").style.display = "none";
  }

  if(!p.active && !isAdmin){
    body.innerHTML = `<p class="poll-empty">지금은 진행 중인 투표가 없어요</p>`;
    return;
  }
  if(opts.length < 2){
    body.innerHTML = `<p class="poll-empty">선택지를 2개 이상 준비 중이에요</p>`;
    return;
  }

  let counts = {};
  opts.forEach(o => counts[o.idx] = 0);
  try{
    const snap = await db.collection("pollvotes").where("version", "==", p.version).get();
    snap.forEach(doc=>{
      const optIdx = doc.data().optIdx;
      if(counts[optIdx] !== undefined) counts[optIdx]++;
    });
  }catch(e){ console.error(e); }
  const total = Object.values(counts).reduce((a,b)=>a+b, 0);
  const myChoice = localStorage.getItem(`pollChoice-v${p.version}`);

  body.innerHTML = `<div class="poll-options">` + opts.map(o=>{
    const c = counts[o.idx] || 0;
    const pct = total > 0 ? Math.round((c/total)*100) : 0;
    const voted = String(o.idx) === myChoice;
    return `<button class="poll-opt ${voted?"voted":""}" data-optidx="${o.idx}" ${!p.active?"disabled":""}>
      <span class="fill" style="width:${pct}%"></span>
      <span class="row"><span>${escapeHtml(o.label)}${voted?" ✓":""}</span><span class="pct">${c}표 · ${pct}%</span></span>
    </button>`;
  }).join("") + `</div><p class="poll-note">${p.active ? (myChoice ? "다른 선택지를 눌러 표를 바꿀 수 있어요" : "원하는 항목을 눌러 투표해보세요") : "투표가 마감됐어요"}</p>`;

  if(p.active){
    body.querySelectorAll(".poll-opt").forEach(btn=>{
      btn.addEventListener("click", () => votePoll(Number(btn.dataset.optidx)));
    });
  }
}

async function votePoll(optIdx){
  const p = state.poll;
  const voterId = getViewerId();
  const choiceKey = `pollChoice-v${p.version}`;
  const prev = localStorage.getItem(choiceKey);
  if(prev === String(optIdx)) return;
  try{
    await db.collection("pollvotes").doc(`${p.version}_${voterId}`).set({
      version: p.version, optIdx: optIdx, voterId: voterId
    });
    localStorage.setItem(choiceKey, String(optIdx));
    await renderPoll();
  }catch(e){
    console.error(e);
    showToast("투표 처리에 실패했어요");
  }
}

document.getElementById("pollSaveBtn").addEventListener("click", async ()=>{
  state.poll.question = document.getElementById("pollQInput").value.trim();
  state.poll.options = [
    document.getElementById("pollOpt0").value.trim(),
    document.getElementById("pollOpt1").value.trim(),
    document.getElementById("pollOpt2").value.trim(),
    document.getElementById("pollOpt3").value.trim()
  ];
  state.poll.active = document.getElementById("pollActive").checked;
  await saveData();
  await renderPoll();
});
document.getElementById("pollResetBtn").addEventListener("click", async ()=>{
  state.poll.version = (state.poll.version || 1) + 1;
  await saveData();
  await renderPoll();

});

/* ---------- suggestions ---------- */
document.getElementById("suggestSendBtn").addEventListener("click", async ()=>{
  const title = document.getElementById("suggestTitle").value.trim();
  const txt = document.getElementById("suggestText").value.trim();
  if(!title){ showToast("제목을 입력해주세요"); return; }
  try{
    await db.collection("suggestions").add({
      title: title, text: txt, authorId: getViewerId(), createdAt: new Date().toISOString()
    });
    document.getElementById("suggestTitle").value = "";
    document.getElementById("suggestText").value = "";
    showToast("제안이 접수됐어요");
    await loadSuggestions();
  }catch(e){
    console.error(e);
    showToast("전송에 실패했어요. 다시 시도해주세요");
  }
});

async function loadSuggestions(){
  const listEl = document.getElementById("suggestList");
  listEl.innerHTML = `<p class="poll-empty">불러오는 중...</p>`;
  let items = [];
  try{
    const snap = await db.collection("suggestions").get();
    items = snap.docs.map(d => ({ key: d.id, ...d.data() }));
  }catch(e){ console.error(e); items = []; }
  items.sort((a,b) => (b.createdAt||"").localeCompare(a.createdAt||""));

  document.getElementById("suggestCount").textContent = `총 ${items.length}건`;
  document.getElementById("suggestClearBtn").style.display = isAdmin ? "inline-block" : "none";
  if(items.length === 0){
    listEl.innerHTML = `<p class="poll-empty">아직 들어온 제안이 없어요</p>`;
    return;
  }
  const myId = getViewerId();
  listEl.innerHTML = items.map(it=>{
    const d = it.createdAt ? new Date(it.createdAt) : null;
    const dateStr = d ? `${d.getFullYear()}.${pad(d.getMonth()+1)}.${pad(d.getDate())}` : "";
    const isMine = it.authorId && it.authorId === myId;
    const canSee = isAdmin || isMine;
    const tag = isMine ? `<span class="tag mine">내가 쓴 글</span>` : "";
    const body = canSee
      ? `<div class="txt">${escapeHtml(it.text || "(내용 없음)")}</div>`
      : `<div class="locked">🔒 비밀글이에요 · 작성자와 관리자만 볼 수 있어요</div>`;
    const delBtn = isAdmin ? `<button data-key="${escapeAttr(it.key)}" class="del-suggest">삭제</button>` : "";
    return `<div class="suggest-item">
      <div class="suggest-item-head">
        <div class="title-row"><span class="th">${escapeHtml(it.title || "(제목 없음)")}</span>${tag}</div>
        ${delBtn}
      </div>
      ${body}
      <div class="meta">${dateStr}</div>
    </div>`;
  }).join("");
  listEl.querySelectorAll(".del-suggest").forEach(btn=>{
    btn.addEventListener("click", async ()=>{
      try{
        await db.collection("suggestions").doc(btn.dataset.key).delete();
        await loadSuggestions();
      }catch(e){ showToast("삭제에 실패했어요"); }
    });
  });
}

document.getElementById("suggestClearBtn").addEventListener("click", async ()=>{
  try{
    const snap = await db.collection("suggestions").get();
    const batch = db.batch();
    snap.docs.forEach(d => batch.delete(d.ref));
    await batch.commit();
  }catch(e){ console.error(e); }
  await loadSuggestions();
  showToast("모두 삭제했어요");
});

/* ---------- render ---------- */
function render(){
  document.getElementById("modeBtn").textContent = isAdmin ? "공개 화면 보기" : "관리자 모드";
  document.getElementById("modeBtn").classList.toggle("on", isAdmin);
  document.getElementById("adminBanner").style.display = isAdmin ? "flex" : "none";
  document.getElementById("saveBar").style.display = isAdmin ? "flex" : "none";
  document.getElementById("progressEdit").style.display = isAdmin ? "flex" : "none";

  // announcement
  document.getElementById("announceEdit").style.display = isAdmin ? "block" : "none";
  document.getElementById("announceInput").value = state.announcement || "";
  const hasAnnounce = !isAdmin && state.announcement && state.announcement.trim();
  document.getElementById("announceBanner").style.display = hasAnnounce ? "flex" : "none";
  document.getElementById("announceText").textContent = " " + (state.announcement || "");

  // suggestion visibility
  document.getElementById("suggestForm").style.display = isAdmin ? "none" : "flex";
  loadSuggestions();

  const list = document.getElementById("scheduleList");
  const tIdx = todayIndex();
  list.innerHTML = state.days.map((day, i) => {
    const isToday = i === tIdx;
    if(!isAdmin){
      if(!day.published){
        return `<li class="day-row ${isToday?"today":""}">
          <div class="day-label">${DAY_NAMES[i]}${isToday?'<span class="dot">오늘</span>':''}</div>
          <div class="day-body"><p class="day-title placeholder">준비 중</p></div>
        </li>`;
      }
      return `<li class="day-row ${isToday?"today":""}">
        <div class="day-label">${DAY_NAMES[i]}${isToday?'<span class="dot">오늘</span>':''}</div>
        <div class="day-body">
          <p class="day-title">${escapeHtml(day.title)}</p>
          <p class="day-time">${escapeHtml(day.time)}</p>
          <div class="chips">${day.cats.map(chipHtml).join("")}</div>
        </div>
      </li>`;
    }
    return `<li class="day-row ${isToday?"today":""}">
      <div class="day-label">${DAY_NAMES[i]}${isToday?'<span class="dot">오늘</span>':''}</div>
      <div class="day-body">
        <div class="edit-fields">
          <input type="text" data-field="title" data-idx="${i}" value="${escapeAttr(day.title)}" placeholder="콘텐츠명">
          <div class="edit-row">
            <input type="text" data-field="time" data-idx="${i}" value="${escapeAttr(day.time)}" placeholder="시간 표시 텍스트">
          </div>
          <div class="edit-row">
            <label class="mini">시작<input type="time" data-field="startTime" data-idx="${i}" value="${day.startTime||''}"></label>
            <label class="mini">종료<input type="time" data-field="endTime" data-idx="${i}" value="${day.endTime||''}"></label>
          </div>
          <div class="field-label">시작/종료 시각은 카운트다운·캘린더 계산에 쓰여요</div>
          <div class="edit-row">
            <select data-field="cat0" data-idx="${i}">${categoryOptions(day.cats[0])}</select>
            <select data-field="cat1" data-idx="${i}">${categoryOptions(day.cats[1] || "없음")}</select>
          </div>
          <div class="field-label">내부 메모 (시청자에게 보이지 않음)</div>
          <div class="memo-box"><textarea data-field="memo" data-idx="${i}" placeholder="메모">${escapeHtml(day.memo||"")}</textarea></div>
          <label class="publish-toggle">
            <input type="checkbox" data-field="published" data-idx="${i}" ${day.published?"checked":""}>
            시청자에게 공개
          </label>
        </div>
      </div>
    </li>`;
  }).join("");

  if(isAdmin){
    list.querySelectorAll("[data-field]").forEach(el=>{
      const evt = (el.tagName==="SELECT" || el.type==="checkbox") ? "change" : "input";
      el.addEventListener(evt, onDayFieldChange);
    });
  }

  const p = state.progress;
  document.getElementById("progressTitle").textContent = p.title;
  document.getElementById("ddayLabel").textContent = ddayText(p.deadline);
  const pct = Math.max(0, Math.min(100, Math.round((p.current / p.target) * 100)));
  document.getElementById("barFill").style.width = pct + "%";
  document.getElementById("progressNums").textContent = `${p.current}편 / 목표 ${p.target}편`;
  document.getElementById("progressPercent").textContent = pct + "%";
  document.getElementById("editTitle").value = p.title;
  document.getElementById("editCurrent").value = p.current;
  document.getElementById("editTarget").value = p.target;
  document.getElementById("editDeadline").value = p.deadline;

  const footer = document.getElementById("footerNote");
  if(!isAdmin && state.updatedAt){
    const d = new Date(state.updatedAt);
    footer.textContent = `일정은 사정에 따라 바뀔 수 있어요 · 마지막 업데이트 ${d.getFullYear()}.${pad(d.getMonth()+1)}.${pad(d.getDate())}`;
  } else if(!isAdmin){
    footer.textContent = "일정은 사정에 따라 바뀔 수 있어요";
  } else {
    footer.textContent = "";
  }

  renderCountdown();
  renderPoll();
}

function onDayFieldChange(e){
  const idx = Number(e.target.dataset.idx);
  const field = e.target.dataset.field;
  const day = state.days[idx];
  if(field === "title") day.title = e.target.value;
  else if(field === "time") day.time = e.target.value;
  else if(field === "startTime") day.startTime = e.target.value;
  else if(field === "endTime") day.endTime = e.target.value;
  else if(field === "cat0") day.cats[0] = e.target.value;
  else if(field === "cat1") day.cats[1] = e.target.value;
  else if(field === "memo") day.memo = e.target.value;
  else if(field === "published") day.published = e.target.checked;
}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function escapeAttr(str){ return escapeHtml(str); }

document.getElementById("announceInput").addEventListener("input", (e)=>{ state.announcement = e.target.value; });

["editTitle","editCurrent","editTarget","editDeadline"].forEach(id=>{
  document.getElementById(id).addEventListener("input", ()=>{
    const p = state.progress;
    p.title = document.getElementById("editTitle").value;
    p.current = Number(document.getElementById("editCurrent").value) || 0;
    p.target = Math.max(1, Number(document.getElementById("editTarget").value) || 1);
    p.deadline = document.getElementById("editDeadline").value || p.deadline;
    document.getElementById("progressTitle").textContent = p.title;
    document.getElementById("ddayLabel").textContent = ddayText(p.deadline);
    const pct = Math.max(0, Math.min(100, Math.round((p.current / p.target) * 100)));
    document.getElementById("barFill").style.width = pct + "%";
    document.getElementById("progressNums").textContent = `${p.current}편 / 목표 ${p.target}편`;
    document.getElementById("progressPercent").textContent = pct + "%";
  });
});

/* ---------- admin login modal ---------- */
function openModal(mode){
  modalMode = mode;
  const pw = document.getElementById("adminPassword");
  const pwConfirm = document.getElementById("adminPasswordConfirm");
  const title = document.getElementById("modalTitle");
  const desc = document.getElementById("modalDesc");
  const confirmBtn = document.getElementById("modalConfirm");
  const err = document.getElementById("modalError");

  pw.value = ""; pwConfirm.value = ""; err.style.display = "none";

  if(mode === "setup"){
    title.textContent = "관리자 비밀번호 만들기";
    desc.textContent = "처음 사용하시네요. 앞으로 관리자 모드에 들어올 때 쓸 비밀번호를 정해주세요.";
    pwConfirm.style.display = "block";
    confirmBtn.textContent = "설정하고 시작";
  } else if(mode === "change"){
    title.textContent = "새 비밀번호 설정";
    desc.textContent = "다음 로그인부터 사용할 새 비밀번호를 입력하세요.";
    pwConfirm.style.display = "block";
    confirmBtn.textContent = "변경하기";
  } else {
    title.textContent = "관리자 로그인";
    desc.textContent = "비밀번호를 입력하면 편집 화면으로 전환돼요.";
    pwConfirm.style.display = "none";
    confirmBtn.textContent = "로그인";
  }
  document.getElementById("modalOverlay").style.display = "flex";
  pw.focus();
}
function closeModal(){ document.getElementById("modalOverlay").style.display = "none"; }

document.getElementById("modeBtn").addEventListener("click", ()=>{
  if(isAdmin){ isAdmin = false; render(); }
  else{ openModal(state.adminPasswordHash ? "login" : "setup"); }
});
document.getElementById("exitAdminBtn").addEventListener("click", ()=>{ isAdmin = false; render(); });
document.getElementById("changePwBtn").addEventListener("click", ()=>{ openModal("change"); });
document.getElementById("modalCancel").addEventListener("click", closeModal);

document.getElementById("modalConfirm").addEventListener("click", async ()=>{
  const pw = document.getElementById("adminPassword").value;
  const pwConfirm = document.getElementById("adminPasswordConfirm").value;
  const err = document.getElementById("modalError");

  if(modalMode === "login"){
    if(!pw){ err.textContent = "비밀번호를 입력해주세요."; err.style.display = "block"; return; }
    const hash = await hashText(pw);
    if(hash === state.adminPasswordHash){
      closeModal(); isAdmin = true; render();
    } else {
      err.textContent = "비밀번호가 올바르지 않아요.";
      err.style.display = "block";
    }
  } else {
    if(pw.length < 4){ err.textContent = "비밀번호는 4자 이상으로 정해주세요."; err.style.display = "block"; return; }
    if(pw !== pwConfirm){ err.textContent = "두 비밀번호가 서로 달라요."; err.style.display = "block"; return; }
    state.adminPasswordHash = await hashText(pw);
    closeModal(); isAdmin = true;
    await saveData();
    showToast(modalMode === "setup" ? "비밀번호가 설정됐어요" : "비밀번호를 변경했어요");
  }
});
document.getElementById("adminPassword").addEventListener("keydown", (e)=>{ if(e.key === "Enter") document.getElementById("modalConfirm").click(); });
document.getElementById("adminPasswordConfirm").addEventListener("keydown", (e)=>{ if(e.key === "Enter") document.getElementById("modalConfirm").click(); });

document.getElementById("saveBtn").addEventListener("click", saveData);
document.getElementById("icsBtn").addEventListener("click", downloadICS);

loadData();
</script>
