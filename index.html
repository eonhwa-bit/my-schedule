<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>이번 주 방송 · 시집 진행률</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #EDEAE2; --paper-deep: #E1DDD0; --ink: #262A31; --ink-soft: #6C727C;
    --vermillion: #A9863E; --line: rgba(38,42,49,0.14);
    --c-siwriting: #A9863E; --c-program: #465268; --c-adsp: #3F5A5C; --c-lecture: #5C4B5E;
    --c-free: #5C6B4E; --c-game: #33404F; --c-prep: #8C7B65;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{ background:var(--paper); color:var(--ink); font-family:'Noto Sans KR','Apple SD Gothic Neo',sans-serif; line-height:1.6; -webkit-font-smoothing:antialiased; }
  .wrap{ max-width:640px; margin:0 auto; padding:28px 16px; }
  .page-card{ background:var(--paper-deep); border-radius:16px; padding:28px 26px 32px; }
  header{ display:flex; justify-content:space-between; align-items:flex-start; gap:16px; margin-bottom:22px; }
  .title-row{ display:flex; align-items:center; gap:10px; margin-bottom:6px; }
  h1{ font-family:'Noto Serif KR',serif; font-weight:700; font-size:26px; margin:0; letter-spacing:-0.01em; }
  .sub{ color:var(--ink-soft); font-size:13.5px; margin:0; }
  .announce{ display:none; align-items:center; gap:10px; background:var(--vermillion); padding:12px 16px; border-radius:8px; font-size:13.5px; margin-bottom:20px; }
  .announce .icon{ flex:0 0 auto; width:18px; height:18px; }
  .announce b{ color:#fff; font-weight:700; margin-right:6px; }
  .announce span:not(.icon){ color:#fff; }
  .section-title{ display:flex; align-items:center; gap:8px; font-family:'Noto Serif KR',serif; font-size:15px; font-weight:500; margin:26px 0 12px; color:var(--ink); }
  .section-title svg{ flex:0 0 auto; opacity:0.75; }
  .section-title:first-of-type{ margin-top:0; }
  .countdown-card{ display:none; align-items:center; justify-content:space-between; gap:10px; background:var(--ink); color:var(--paper); padding:14px 18px; border-radius:10px; margin-bottom:22px; flex-wrap:wrap; }
  .countdown-card .cd-label{ font-size:12px; color:rgba(237,234,226,0.65); }
  .countdown-card .cd-main{ font-family:'Noto Serif KR',serif; font-size:16px; font-weight:500; }
  .countdown-card .cd-time{ font-size:20px; font-weight:700; color:var(--vermillion); }
  .schedule{ list-style:none; margin:0; padding:0; border-top:1px solid var(--line); background:#fff; border-radius:10px; overflow:hidden; border:0.5px solid var(--line); border-top:0.5px solid var(--line); }
  .day-row{ display:flex; gap:14px; padding:12px 14px; border-bottom:0.5px solid var(--line); position:relative; }
  .day-row:last-child{ border-bottom:none; }
  .day-row.today{ background-color:var(--paper); border-left:2px solid var(--vermillion); padding-left:12px; }
  .day-label{ flex:0 0 46px; font-family:'Noto Serif KR',serif; font-weight:700; font-size:15px; padding-top:2px; }
  .day-label .dot{ display:block; font-size:9px; color:var(--vermillion); font-family:'Noto Sans KR',sans-serif; font-weight:700; margin-top:2px; }
  .day-body{ flex:1; min-width:0; }
  .day-title{ font-size:15px; font-weight:500; margin:0 0 4px; }
  .day-title.placeholder{ color:var(--ink-soft); }
  .day-time{ font-size:12px; color:var(--ink-soft); margin:0 0 6px; }
  .chips{ display:flex; flex-wrap:wrap; gap:6px; }
  .chip{ font-size:11px; padding:2px 9px; border-radius:999px; color:#fff; line-height:1.7; }
  .ics-btn-wrap{ text-align:center; margin-top:14px; }
  .ics-btn{ background:#fff; border:0.5px solid var(--line); color:var(--ink); font-family:inherit; font-size:12.5px; padding:9px 18px; border-radius:99px; cursor:pointer; display:inline-flex; align-items:center; gap:6px; }
  .ics-btn:hover{ background:var(--ink); color:var(--paper); border-color:var(--ink); }
  .vod-list{ display:flex; flex-direction:column; gap:6px; }
  .vod-item{ display:flex; align-items:center; gap:10px; background:#fff; border:0.5px solid var(--line); border-radius:8px; padding:10px 14px; font-size:13px; text-decoration:none; color:var(--ink); }
  .vod-item:hover{ background:var(--paper); }
  .vod-item .d{ font-size:11.5px; color:var(--ink-soft); margin-left:auto; }
  .embed-card{ background:#fff; border:0.5px solid var(--line); border-radius:10px; overflow:hidden; }
  .embed-empty{ padding:18px; font-size:13px; color:var(--ink-soft); text-align:center; }
  .progress-card{ background:#fff; border:0.5px solid var(--line); border-radius:10px; padding:18px 18px; }
  .progress-head{ display:flex; justify-content:space-between; align-items:baseline; gap:10px; margin-bottom:12px; }
  .progress-title{ font-family:'Noto Serif KR',serif; font-size:15.5px; font-weight:500; margin:0; }
  .dday{ font-size:12.5px; font-weight:700; color:var(--vermillion); white-space:nowrap; }
  .bar-track{ background:rgba(43,41,38,0.1); height:8px; border-radius:99px; overflow:hidden; margin-bottom:8px; }
  .bar-fill{ height:100%; background:var(--vermillion); border-radius:99px; }
  .progress-nums{ display:flex; justify-content:space-between; font-size:12px; color:var(--ink-soft); }
  .rules{ margin:0; padding:14px 14px 14px 30px; background:#fff; border:0.5px solid var(--line); border-radius:10px; font-size:13px; color:var(--ink); }
  .rules li{ margin-bottom:6px; }
  .rules li:last-child{ margin-bottom:0; }
  footer{ margin-top:26px; font-size:11px; color:var(--ink-soft); text-align:center; }
  @media (max-width:420px){ h1{font-size:22px;} .page-card{padding:20px 16px 26px;} .day-row{gap:10px;} .day-label{flex-basis:38px; font-size:14px;} .countdown-card{flex-direction:column; align-items:flex-start;} }
</style>
</head>
<body>
<div class="wrap">
<div class="page-card">
  <header>
    <div>
      <div class="title-row">
        <svg width="34" height="16" viewBox="0 0 34 16" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <circle cx="8" cy="8" r="6.5" stroke="var(--ink)" stroke-width="1.4"/>
          <circle cx="26" cy="8" r="6.5" stroke="var(--ink)" stroke-width="1.4"/>
          <path d="M14.5 7C15.5 5.5 18.5 5.5 19.5 7" stroke="var(--ink)" stroke-width="1.4"/>
          <path d="M1.5 8H0" stroke="var(--ink)" stroke-width="1.4"/>
          <path d="M34 8H32.5" stroke="var(--ink)" stroke-width="1.4"/>
        </svg>
        <h1>이번 주 방송</h1>
      </div>
      <p class="sub">매일 밤, 코드와 문장 사이</p>
    </div>
  </header>

  <div class="announce" id="announceBanner">
    <svg class="icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M12 3C9.5 3 8 5 8 7.5V11L6 15h12l-2-4V7.5C16 5 14.5 3 12 3Z" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M10 17.5a2 2 0 0 0 4 0" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/>
    </svg>
    <span><b>공지</b><span id="announceText"></span></span>
  </div>

  <div class="countdown-card" id="countdownCard">
    <div><div class="cd-label">다음 방송</div><div class="cd-main" id="cdMain"></div></div>
    <div class="cd-time" id="cdTime"></div>
  </div>

  <h2 class="section-title"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--ink)" stroke-width="1.6" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 9h18M8 3v4M16 3v4"/></svg>요일별 방송</h2>
  <ul class="schedule" id="scheduleList"></ul>
  <div class="ics-btn-wrap"><button class="ics-btn" id="icsBtn"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 9h18M8 3v4M16 3v4"/></svg>캘린더에 이번 주 일정 추가 (.ics)</button></div>

  <h2 class="section-title"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--ink)" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M10 8.5l6 3.5-6 3.5z"/></svg>지난 방송 다시보기</h2>
  <div class="vod-list" id="vodList"></div>

  <h2 class="section-title"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--ink)" stroke-width="1.6" aria-hidden="true"><path d="M4 20V10M12 20V4M20 20v-7"/></svg>다음 방송 주제 투표</h2>
  <div class="embed-card" id="pollEmbed"></div>

  <h2 class="section-title"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--ink)" stroke-width="1.6" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>시청자 건의함</h2>
  <div class="embed-card" id="suggestEmbed"></div>

  <h2 class="section-title"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--ink)" stroke-width="1.6" aria-hidden="true"><path d="M4 4.5A2.5 2.5 0 0 1 6.5 2H20v16H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 4.5v16"/></svg>브런치 시집 진행률</h2>
  <div class="progress-card">
    <div class="progress-head"><p class="progress-title" id="progressTitle"></p><span class="dday" id="ddayLabel"></span></div>
    <div class="bar-track"><div class="bar-fill" id="barFill"></div></div>
    <div class="progress-nums"><span id="progressNums"></span><span id="progressPercent"></span></div>
  </div>

  <h2 class="section-title"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--ink)" stroke-width="1.6" aria-hidden="true"><path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6z"/><path d="M9 12l2 2 4-4"/></svg>방송 규칙</h2>
  <ul class="rules" id="rulesList"></ul>

  <footer>일정은 사정에 따라 바뀔 수 있어요</footer>
</div>
</div>

<script>
/* ====================================================
   여기서부터 편집: 공지 / 일정 / 다시보기 / 폼 링크 / 진행률 / 규칙
   ==================================================== */
const ANNOUNCEMENT = ""; // 예: "이번 주 목요일 방송은 11시로 미뤄져요" (비워두면 안 보임)

const CATEGORIES = {
  "시쓰기":{label:"시 쓰기",color:"var(--c-siwriting)"}, "프로그램개발":{label:"프로그램 개발",color:"var(--c-program)"},
  "ADsP공부":{label:"ADsP 공부",color:"var(--c-adsp)"}, "강의프롬프트":{label:"강의·프롬프트",color:"var(--c-lecture)"},
  "자유방송":{label:"자유 방송",color:"var(--c-free)"}, "종합게임":{label:"종합게임",color:"var(--c-game)"},
  "주간준비":{label:"다음주 준비",color:"var(--c-prep)"}, "없음":{label:"없음",color:"#999"}
};

const DAYS = [
  { title:"시 쓰기 + ADsP 공부", time:"22:00 - 23:00", startTime:"22:00", endTime:"23:00", cats:["시쓰기","ADsP공부"], published:true },
  { title:"프로그램 개발 방송",   time:"22:00 - 23:00", startTime:"22:00", endTime:"23:00", cats:["프로그램개발","없음"], published:true },
  { title:"시 쓰기",             time:"22:00 - 23:00", startTime:"22:00", endTime:"23:00", cats:["시쓰기","없음"], published:true },
  { title:"강의·프롬프트 제작",   time:"22:00 - 23:00", startTime:"22:00", endTime:"23:00", cats:["강의프롬프트","없음"], published:true },
  { title:"자유 방송",           time:"22:00 - 23:00", startTime:"22:00", endTime:"23:00", cats:["자유방송","없음"], published:true },
  { title:"시 쓰기 + 종합게임",   time:"13:00 ~",       startTime:"13:00", endTime:"15:00", cats:["시쓰기","종합게임"], published:true },
  { title:"시 쓰기 + 다음주 준비", time:"13:00 ~",       startTime:"13:00", endTime:"15:00", cats:["시쓰기","주간준비"], published:true }
];

// 다시보기 목록: title, url, date (없으면 배열을 비워두세요 → []")
const VODS = [
  // { title: "9/5 자유 방송 다시보기", url: "https://chzzk.naver.com/...", date: "9.05" },
];

// Tally(또는 Google Forms) 폼 주소를 만드신 뒤 여기에 붙여넣으세요. 비워두면 "준비 중"으로 표시됩니다.
const POLL_EMBED_URL = "";     // 예: "https://tally.so/embed/xxxxx"
const SUGGEST_EMBED_URL = "";  // 예: "https://tally.so/embed/yyyyy"

const PROGRESS = { title:"제한사항 시집 (브런치 공모전)", current:0, target:20, deadline:"2026-10-18" };

const RULES = [
  "서로 존중하는 채팅 부탁드려요",
  "후원 문구는 방송 중 자동으로 낭독돼요",
  "스포일러성 발언은 삼가주세요"
];

/* ==================================================== */

const DAY_NAMES=["월","화","수","목","금","토","일"], BYDAY=["MO","TU","WE","TH","FR","SA","SU"];
function pad(n){return String(n).padStart(2,"0");}
function todayIndex(){const d=new Date().getDay();return (d+6)%7;}
function ddayText(deadline){
  const now=new Date(), target=new Date(deadline+"T23:59:59");
  const diffMs=target-new Date(now.getFullYear(),now.getMonth(),now.getDate());
  const days=Math.ceil(diffMs/86400000);
  if(days>0) return "D-"+days; if(days===0) return "D-DAY"; return "마감";
}
function chipHtml(k){const c=CATEGORIES[k]||CATEGORIES["없음"]; if(k==="없음") return ""; return `<span class="chip" style="background:${c.color}">${c.label}</span>`;}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function nextOccurrence(dayIdx,hhmm){
  if(!hhmm) return null;
  const [h,m]=hhmm.split(":").map(Number), now=new Date(), tIdx=todayIndex();
  let delta=(dayIdx-tIdx+7)%7;
  let candidate=new Date(now.getFullYear(),now.getMonth(),now.getDate()+delta,h,m,0,0);
  if(candidate<=now){candidate=new Date(candidate.getTime()+7*86400000);}
  return candidate;
}
function findNextBroadcast(){
  let best=null;
  DAYS.forEach((day,i)=>{ if(!day.published||!day.startTime) return; const dt=nextOccurrence(i,day.startTime); if(dt&&(!best||dt<best.dt)) best={dt,day,i}; });
  return best;
}
function renderCountdown(){
  const card=document.getElementById("countdownCard"); const next=findNextBroadcast();
  if(!next){card.style.display="none";return;} card.style.display="flex";
  const diff=next.dt-new Date(); const totalMin=Math.max(0,Math.floor(diff/60000));
  const d=Math.floor(totalMin/1440), h=Math.floor((totalMin%1440)/60), m=totalMin%60;
  let t; if(d>0) t=`${d}일 ${h}시간 후`; else if(h>0) t=`${h}시간 ${m}분 후`; else t=`${m}분 후`;
  document.getElementById("cdMain").textContent=`${DAY_NAMES[next.i]}요일 · ${next.day.title}`;
  document.getElementById("cdTime").textContent=t;
}
function renderSchedule(){
  const list=document.getElementById("scheduleList"), tIdx=todayIndex();
  list.innerHTML=DAYS.map((day,i)=>{
    const isToday=i===tIdx;
    if(!day.published) return `<li class="day-row ${isToday?"today":""}"><div class="day-label">${DAY_NAMES[i]}${isToday?'<span class="dot">오늘</span>':''}</div><div class="day-body"><p class="day-title placeholder">준비 중</p></div></li>`;
    return `<li class="day-row ${isToday?"today":""}"><div class="day-label">${DAY_NAMES[i]}${isToday?'<span class="dot">오늘</span>':''}</div><div class="day-body"><p class="day-title">${escapeHtml(day.title)}</p><p class="day-time">${escapeHtml(day.time)}</p><div class="chips">${day.cats.map(chipHtml).join("")}</div></div></li>`;
  }).join("");
}
function renderVods(){
  const el=document.getElementById("vodList");
  if(!VODS.length){ el.innerHTML=`<div class="embed-empty">아직 등록된 다시보기가 없어요</div>`; return; }
  el.innerHTML=VODS.map(v=>`<a class="vod-item" href="${v.url}" target="_blank" rel="noopener"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--ink-soft)" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M10 8.5l6 3.5-6 3.5z"/></svg><span>${escapeHtml(v.title)}</span><span class="d">${escapeHtml(v.date||"")}</span></a>`).join("");
}
function renderEmbed(id,url,label){
  const el=document.getElementById(id);
  if(!url){ el.innerHTML=`<div class="embed-empty">${label} 준비 중이에요</div>`; return; }
  el.innerHTML=`<iframe src="${url}" style="width:100%; height:420px; border:0;" loading="lazy"></iframe>`;
}
function renderProgress(){
  const p=PROGRESS;
  document.getElementById("progressTitle").textContent=p.title;
  document.getElementById("ddayLabel").textContent=ddayText(p.deadline);
  const pct=Math.max(0,Math.min(100,Math.round((p.current/p.target)*100)));
  document.getElementById("barFill").style.width=pct+"%";
  document.getElementById("progressNums").textContent=`${p.current}편 / 목표 ${p.target}편`;
  document.getElementById("progressPercent").textContent=pct+"%";
}
function renderAnnounce(){
  const has=ANNOUNCEMENT&&ANNOUNCEMENT.trim();
  document.getElementById("announceBanner").style.display=has?"flex":"none";
  document.getElementById("announceText").textContent=" "+ANNOUNCEMENT;
}
function renderRules(){
  document.getElementById("rulesList").innerHTML=RULES.map(r=>`<li>${escapeHtml(r)}</li>`).join("");
}
function formatICSDate(dt){return `${dt.getFullYear()}${pad(dt.getMonth()+1)}${pad(dt.getDate())}T${pad(dt.getHours())}${pad(dt.getMinutes())}00`;}
function escapeICS(s){return String(s).replace(/[,;]/g,"\\$&").replace(/\n/g," ");}
function buildICS(){
  const lines=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//weekly-schedule//KR","CALSCALE:GREGORIAN"];
  DAYS.forEach((day,i)=>{
    if(!day.published||!day.startTime) return;
    const start=nextOccurrence(i,day.startTime); let end;
    if(day.endTime){ const [eh,em]=day.endTime.split(":").map(Number); end=new Date(start.getFullYear(),start.getMonth(),start.getDate(),eh,em,0,0); if(end<=start) end=new Date(end.getTime()+86400000); }
    else{ end=new Date(start.getTime()+2*3600000); }
    lines.push("BEGIN:VEVENT",`UID:day${i}-weekly-schedule@static`,`DTSTAMP:${formatICSDate(new Date())}`,`DTSTART:${formatICSDate(start)}`,`DTEND:${formatICSDate(end)}`,`RRULE:FREQ=WEEKLY;BYDAY=${BYDAY[i]}`,`SUMMARY:${escapeICS(day.title)}`,"END:VEVENT");
  });
  lines.push("END:VCALENDAR"); return lines.join("\r\n");
}
document.getElementById("icsBtn").addEventListener("click",()=>{
  if(!DAYS.some(d=>d.published&&d.startTime)){ alert("등록할 공개 일정이 없어요"); return; }
  const blob=new Blob([buildICS()],{type:"text/calendar;charset=utf-8"});
  const url=URL.createObjectURL(blob); const a=document.createElement("a");
  a.href=url; a.download="weekly-broadcast.ics"; document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
});

renderAnnounce(); renderCountdown(); setInterval(renderCountdown,30000);
renderSchedule(); renderVods(); renderEmbed("pollEmbed",POLL_EMBED_URL,"투표"); renderEmbed("suggestEmbed",SUGGEST_EMBED_URL,"건의함");
renderProgress(); renderRules();
</script>
</body>
</html>
